# InstantTransfer proxy-plugin config — mounted read-only at
# /app/plugins/instanttransfer/config.properties by docker-compose.yml.
# debug=true is REQUIRED for the live session: it enables the chunk/movement peek verify
# logs, "arrival teleport ... freeze on" and other per-switch assertions in RUNBOOK.md.
seamless-enabled=true
require-same-dimension=true
debug=true
guard-timeout-ms=5000
